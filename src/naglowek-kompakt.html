<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brenna-Górki – nagłówek kompaktowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
    .ln{fill:none;stroke:#1d1d1b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .th{stroke-width:1}
    .hx{fill:url(#hatch);stroke:none}
    .bk{fill:#1d1d1b;stroke:none}
    .wh{fill:#fff;stroke:none}
  
:root{--paper:#f7f5ef;--grid:#e6e2d6;--ink:#1d1d1b;--sky:#cfe2ec;--spruce:#2f5d45;--beech:#6f9a4a;--grass:#7aa35a;--ridge:#c9d6c2;--ridge2:#e3eadf}
body[data-season="wiosna"]{--spruce:#3d7354;--beech:#9cc95f;--grass:#a6cf6b;--ridge:#d5e4cf;--ridge2:#e8f0e3;--sky:#d3e7f2}
body[data-season="lato"]{--spruce:#2f5d45;--beech:#5f8f3e;--grass:#78a552;--ridge:#c4d5bd;--ridge2:#e0e9dc;--sky:#c6dfee}
body[data-season="jesien"]{--spruce:#2f5a44;--beech:#d08a2e;--grass:#b3a35a;--ridge:#e2d3b5;--ridge2:#eee6d4;--sky:#d4e2ea}
body[data-season="zima"]{--spruce:#3c5a4c;--beech:#b9b4a6;--grass:#dcdcd4;--ridge:#eceeed;--ridge2:#f3f4f3;--sky:#dfe6ea}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'PT Sans',system-ui,sans-serif;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}

/* ===== NAGŁÓWEK ===== */
#hero{position:relative;height:clamp(240px,34vh,380px);overflow:hidden}
@media (max-width:900px){#hero{height:calc(min(100vw,560px)*.47 + 80px)}}
#sky{position:absolute;inset:0;background:linear-gradient(to bottom,var(--sky) 0%,color-mix(in srgb,var(--sky) 45%,transparent) 38%,transparent 62%);opacity:0;animation:fade 2s ease forwards .2s}
#land{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#scene{position:absolute;left:50%;bottom:var(--groundGap);transform:translateX(-50%);width:var(--sceneW);height:auto;overflow:visible}
#front{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* chmury: obrys cyrklem + miękkie wypełnienie, powoli dryfują */
.cloud{animation:drift linear infinite}
.cloud path{fill:color-mix(in srgb,#fff 82%,transparent);stroke:var(--ink);stroke-width:1;stroke-opacity:.35}
@keyframes drift{from{transform:translateX(var(--from))}to{transform:translateX(var(--to))}}

/* linia gór */
.ridge-line{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
.ridge-line.back{stroke-width:.8;opacity:.4}
.ridge-fill.back{fill:var(--ridge2)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s ease-in-out forwards}
.ridge-fill{opacity:0;animation:fade 1.6s ease forwards 2.2s}

/* menu wpisane w linię gór – jak opis poziomicy */
nav{position:absolute;inset:0;pointer-events:none}
.peak{position:absolute;left:0;top:0;pointer-events:auto;font-size:clamp(14px,1.05vw,17px);letter-spacing:.06em;text-transform:uppercase;
 color:var(--ink);text-decoration:none;white-space:nowrap;padding:6px 4px;line-height:1;
 transform-origin:50% 50%;opacity:0;transition:color .2s}
.peak.on{animation:fade .6s ease forwards}
.peak::after{content:"";position:absolute;left:50%;bottom:-1px;width:0;height:2px;background:var(--spruce);transition:all .25s;transform:translateX(-50%)}
.peak:hover,.peak:focus-visible{color:var(--spruce);outline:none}
.peak:hover::after,.peak:focus-visible::after{width:100%}
.tick{stroke:var(--ink);stroke-width:1}

/* las i logo (jak w prototypie) */
.logo .wh,.sil{fill:var(--paper)} .sil,.sil-post{opacity:0;animation:fade 1s ease forwards 2.4s} .sil-post{fill:color-mix(in srgb,var(--ridge) 55%,var(--paper))}
.ln,.fl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-in-out forwards}
.fl{fill:none;stroke:var(--ink);stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}
.far .fl{stroke-width:.7;opacity:.55} .near .fl{stroke-width:1}
#fills,#text{opacity:0;animation:fade 1s ease forwards}
#fills{animation-delay:3.4s}#text{animation-delay:3.9s}
.leaf{stroke:none;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0;animation:grow .9s cubic-bezier(.3,1.4,.5,1) forwards}
.sp-f{fill:var(--spruce)} .bk-f{fill:var(--beech)}
.far .sp-f{fill:color-mix(in srgb,var(--spruce) 50%,var(--paper))} .far .bk-f{fill:color-mix(in srgb,var(--beech) 50%,var(--paper))}
.near .sp-f:nth-child(even){fill:color-mix(in srgb,var(--spruce) 88%,#000)}
body[data-season="zima"] .sp-f:nth-child(odd){fill:#eef0ee}
.tree{animation:sway 6s ease-in-out infinite alternate 7s}
.tree:nth-child(3n){animation-duration:7.5s} .tree:nth-child(2n){animation-direction:alternate-reverse}
.ground{stroke:var(--ink);stroke-width:1.3}
.gr{fill:none;stroke:var(--grass);stroke-width:1.1;stroke-linecap:round;opacity:0;animation:fade .8s ease forwards 5s}

@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleY(1);opacity:1}} @keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}

/* telefon: menu chowa się pod przyciskiem */
#burger{display:none;position:absolute;top:14px;right:14px;z-index:5;font:inherit;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
 background:var(--paper);border:1px solid var(--ink);padding:8px 12px;border-radius:3px;cursor:pointer}
@media (max-width:900px){
 #burger{display:block}
 nav{position:absolute;inset:auto 14px auto auto;top:58px;z-index:5;display:none;flex-direction:column;background:var(--paper);border:1px solid var(--ink);padding:6px 4px;pointer-events:auto}
 nav.open{display:flex}
 .peak{position:static;transform:none!important;opacity:1!important;animation:none!important;padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){
 *{animation-duration:0s!important;animation-delay:0s!important}
 .cloud,.tree{animation:none!important}
}


/* sezonowe dodatki */
.deco{display:none}
body[data-season="wiosna"] .only-wiosna,body[data-season="lato"] .only-lato,body[data-season="jesien"] .only-jesien,body[data-season="zima"] .only-zima{display:inline}
.sun{fill:#f7dc85;stroke:var(--ink);stroke-width:1}
.rays line{stroke:#d9a62e;stroke-width:1.3;stroke-linecap:round}
.rays{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pylon{stroke:var(--ink);stroke-width:1.2}
.cable{fill:none;stroke:var(--ink);stroke-width:.6}
.station{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.chair line,.chair path{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round}
.stem{fill:none;stroke:#5f8f3e;stroke-width:1}
.bloom{fill:#d2382f;stroke:#8f1f1a;stroke-width:.5}
.leafwrap{animation:fall linear infinite}
@keyframes fall{from{transform:translate(var(--x),-20px)}to{transform:translate(calc(var(--x) + var(--dx)),var(--H))}}
.leafx{stroke:#6b3a14;stroke-width:.5;transform-box:fill-box;transform-origin:50% 50%;animation:flutter ease-in-out infinite alternate}
.l1{fill:#d08a2e}.l2{fill:#b5562a}
@keyframes flutter{from{transform:rotate(-50deg)}to{transform:rotate(50deg)}}
/* rząd drzewek */
.rowtree{opacity:0;animation:fade .9s ease forwards var(--d),windRow 5s ease-in-out var(--w) infinite alternate}
@keyframes windRow{from{transform:rotate(-1.6deg)}to{transform:rotate(1.4deg)}}
@keyframes windTree{from{transform:rotate(-.9deg)}to{transform:rotate(.8deg)}}
.rleaf{fill:color-mix(in srgb,var(--spruce) 62%,var(--paper))}
.rowtree.b .rleaf{fill:color-mix(in srgb,var(--spruce) 80%,var(--paper))}
body[data-season="zima"] .rleaf:nth-of-type(2){fill:#eef0ee}
.rline{fill:none;stroke:var(--ink);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.clouds{opacity:0;animation:fade 2s ease forwards .8s}
.peak{font-size:clamp(13px,1vw,16px)}

/* ===== zimowy wieczór ===== */
body[data-season="zima"]{--ridge:#e6e9ee;--ridge2:#d3dae4}
body[data-season="zima"] #sky{background:linear-gradient(to bottom,#24395a 0%,#4f6a8f 28%,#b9b7c4 52%,#f0d2b4 66%,transparent 80%)}
body[data-season="zima"] .cloud path{fill:color-mix(in srgb,#c9d3e2 70%,transparent);stroke-opacity:.2}
.stars circle{fill:#fff6dc;animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
body[data-season="zima"] .hide-zima{display:none}
/* ciepłe światło w oknach kościoła w Brennej – zapala się po narysowaniu kościoła, migocze jak świeca */
.lit{display:none}
body[data-season="zima"] .lit{display:inline;fill:url(#litg);opacity:0;animation:litIn 2.4s ease 4.2s both,candle 4.6s ease-in-out 6.6s infinite}
body[data-season="zima"] .lit.w2{animation:litIn 2.4s ease 4.6s both,candle 5.3s ease-in-out 7s infinite}
body[data-season="zima"] .lit.w3{animation:litIn 2.4s ease 5s both,candle 6.1s ease-in-out 7.4s infinite}
body.ready[data-season="zima"] .lit{animation-delay:0s,2.4s}
@keyframes litIn{from{opacity:0}to{opacity:.92}}
@keyframes candle{0%{opacity:.95}12%{opacity:.62}18%{opacity:.86}30%{opacity:1}42%{opacity:.52}50%{opacity:.78}58%{opacity:.6}70%{opacity:.98}80%{opacity:.68}88%{opacity:.9}100%{opacity:.95}}
.liftg{opacity:0;animation:fade 1.2s ease 2.4s forwards} body.ready .liftg{animation-delay:0s}
.lf{stroke:#6b3a14;stroke-width:.4}
.ray{stroke-width:1.3;stroke-linecap:round}
.moon{fill:#fbf3d5;stroke:var(--ink);stroke-width:.9}
.crater{fill:#e6dbb6;opacity:.75}
#sky{transition:none}
/* suwak czasu (podgląd) */
.scrub{display:flex;align-items:center;gap:12px;max-width:880px;margin:0 auto;padding:0 16px 36px;font-size:14px}
.scrub button{font:inherit;padding:7px 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer;min-width:118px}
.scrub input{flex:1;accent-color:var(--ink)}
.scrub output{min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.scrub small{display:block;color:#666;font-size:12px;margin-top:2px}
/* zwierzęta */
.critter .fur{fill:#a8957d;stroke:var(--ink);stroke-width:.8}
.critter .ear{fill:#bba78f;stroke:var(--ink);stroke-width:.7}
.critter .tailw{fill:#fff;stroke:var(--ink);stroke-width:.6}
.critter .hide{fill:#b9824f;stroke:var(--ink);stroke-width:.8;stroke-linejoin:round}
.critter .rump{fill:#f6efe2;stroke:var(--ink);stroke-width:.5}
.critter .leg{fill:none;stroke:#3a2a1c;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.critter .eye{fill:var(--ink)}
.snowlayer{fill:url(#snowg)} .snowedge{fill:none;stroke:#8fa6bb;stroke-width:1.1;stroke-linejoin:round}
.flake{fill:#fff;stroke:#7f95aa;stroke-width:.45}
/* jeden aktor naraz: w święto gra scena świąteczna, reszta milknie */
body.feast-on .zoo,body.feast-on .tourists,body.feast-on .liftg,body.feast-on .plow{display:none!important}
body.feast-on .hut,body.feast-on .fire{display:none}
/* tryb statyczny (oszczędzanie danych): wszystko od razu w stanie końcowym */
html.static *{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
/* napisy widoczne od początku */
.peak,.peak.on{opacity:1!important;animation:none!important}
#text{opacity:1!important;animation:none!important}

/* ===== rok kościelny ===== */
.fdraw{stroke-dasharray:1;stroke-dashoffset:1;animation:fdraw 1.1s ease-in-out var(--fd) both,ffill .9s ease calc(var(--fd) + .8s) both}
@keyframes fdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ffill{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes ffade{from{opacity:0}to{opacity:1}}
@keyframes glowP{0%{opacity:.55}35%{opacity:1}60%{opacity:.7}100%{opacity:.95}}
.tongue{fill:#ff9a2e;stroke:#d9531c;stroke-width:.5}
.hide-feast{display:none}
.fi{fill:none;stroke:#1d1d1b;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.ff{stroke:#1d1d1b;stroke-width:.8;stroke-linejoin:round}
.thin{fill:none;stroke:#1d1d1b;stroke-width:.5;opacity:.7}
.needle{fill:none;stroke:#244a37;stroke-width:1.1;stroke-linecap:round}
.flame{fill:#ffb238;stroke:#d96a1c;stroke-width:.4;transform-box:fill-box;transform-origin:50% 100%;animation:flameF .7s ease-in-out infinite alternate}
@keyframes flameF{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.84,1.14) skewX(5deg)}55%{transform:scale(1.06,.9) skewX(-3deg)}80%{transform:scale(.9,1.08) skewX(-6deg)}100%{transform:scale(1.03,.95) skewX(2deg)}}
.leaflet{fill:none;stroke:#4f8a3a;stroke-width:1.1;stroke-linecap:round} .rib{fill:none;stroke:#3d6b2c;stroke-width:1.6;stroke-linecap:round}
.frond{animation:frond 4.5s ease-in-out infinite alternate} @keyframes frond{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.stem{fill:none;stroke:#5f8f3e;stroke-width:1} .wheat{fill:none;stroke:#b8952f;stroke-width:1}
.birchleaf{fill:#8cc45a;opacity:.92} .twig{fill:none;stroke:#5b4a3a;stroke-width:.6} .crownf{fill:var(--beech)} .cloudf{fill:#fffdf8} .eye2{fill:#1d1d1b}
.ray2{stroke:#f2c14e;stroke-width:1.4;stroke-linecap:round;animation:rayp 3s ease-in-out infinite alternate}
@keyframes rayp{from{opacity:.3}to{opacity:.95}}
.starbody{fill:#fff3c4;stroke:#d9a62e;stroke-width:.8} .startail{fill:none;stroke:#fff3c4;stroke-width:2;opacity:.65;stroke-linecap:round}
.star circle{animation:twinkle 2.6s ease-in-out infinite alternate}
@keyframes graze{from{transform:translateY(0)}to{transform:translateY(2px)}}
body.f-boze .moong,body.f-boze .liftg{display:none}
body.f-pasja #hero{filter:saturate(.55)}
body.f-pasja #sky{background:linear-gradient(to bottom,#b3aed0 0%,#d9d4e6 38%,transparent 72%)!important}
body.f-palmowa #hero{filter:saturate(.85)}
body.f-pasja .flowers,body.f-wpiatek .flowers,body.f-wsobota .flowers{display:none}
body.f-wpiatek #hero{filter:grayscale(1) contrast(.92)}
body.f-wsobota #hero{filter:grayscale(.65)}
body.f-wpiatek .zoo,body.f-wsobota .zoo{display:none}
body.f-wpiatek .tree{animation:none!important}
body.f-wpiatek .rowtree{animation:fade .9s ease forwards var(--d)!important}
body.f-wielkanoc #sky{background:linear-gradient(to bottom,#a9bde6 0%,#f6cfc6 30%,#ffe6b3 50%,transparent 80%)!important}
body.f-wiecznosc #sky{background:linear-gradient(to bottom,#3d4672 0%,#8e7ea8 32%,#ead0ae 54%,transparent 80%)!important}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:0 16px 40px;font-size:14px}
.datebar input,.datebar select,.datebar button{font:inherit;padding:6px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:4px}
.datebar output{font-weight:700}

/* podgląd */
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:22px 16px 40px}
.bar button{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.below{max-width:880px;margin:0 auto;padding:10px 20px 0;color:#555;font-size:15px;text-align:center}
</style></head>
<body data-season="jesien">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="fglow"><stop offset="0" stop-color="#ffcf6b" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient><radialGradient id="warm"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/><stop offset=".6" stop-color="#e8a24a" stop-opacity=".35"/><stop offset="1" stop-color="#e8a24a" stop-opacity="0"/></radialGradient><radialGradient id="starglow"><stop offset="0" stop-color="#fff6d0" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d0" stop-opacity="0"/></radialGradient><radialGradient id="whiteglow"><stop offset="0" stop-color="#fffdf2" stop-opacity=".95"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient><linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e1eb"/></linearGradient></defs></svg><header id="hero">
 <div id="sky"></div>

<script>
const NS='http://www.w3.org/2000/svg';

      scene=document.getElementById('scene'),nav=document.getElementById('menu'),peaks=[...nav.querySelectorAll('.peak')];

// tryb statyczny: użytkownik wyłączył animacje albo włączył oszczędzanie danych
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||!!(navigator.connection&&navigator.connection.saveData);

const LOWFPS=innerWidth<=900||(navigator.hardwareConcurrency||8)<=4;let skipFrame=false;

let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

function ridgeY(x,W,H,top,amp){const t=x/Math.max(W,1150);
 return H*(top+amp*(.55*Math.sin(t*6.283*1.15+.6)+.3*Math.sin(t*6.283*2.7+1.9)+.12*Math.sin(t*6.283*6.1+.4)+.05*Math.sin(t*6.283*13+2)))}

function spruce(x,base,h,cls){            // mały świerk: 3 piętra
 const g=el('g',{class:'rowtree '+cls,style:`transform-origin:${x}px ${base}px`});
 const w=h*.42;let d=`M${x},${base-h} V${base}`;
 for(let i=0;i<3;i++){const ty=base-h+i*h*.24,by=ty+h*.42,hw=w*(.45+.55*(i+1)/3)/2;
  g.appendChild(el('polygon',{class:'rleaf',points:`${x},${ty} ${x-hw},${by} ${x+hw},${by}`}));
  d+=` M${x-hw},${by} L${x},${ty} L${x+hw},${by}`}
 g.appendChild(el('path',{class:'rline',d}));return g}

let first=true,chairs=[],liftPath=null,raf=0;
// --- słońce, księżyc i kolory nieba ---
let SN=null;

function plowTimes(){const {W,k}=SN,v=PLOW_V*k,ts=HOUR-(W+300*k)/v-3;return {v,ts}}
const snowMax=()=>SN.H*(SN.mobile?.06:.085);

 // ludzie

 R.P.forEach((p,i)=>{const r=u-start-i*2.2,xr=px+(14+i*7)*sc,xs=W+30,dist=Math.abs(xr-door),walkT=dist/v;

 // stajenka: Maryja kołysze się nad żłobkiem, zwierzęta, owce, anioł; 6.01 wszyscy się kłaniają

  const bw=N.epi?bowC(((t*.16)%1+1)%1):0;

  N.sheep.forEach(([sp,hd,i])=>{const wx=+sp.dataset.x+Math.sin(t*.13+i*2.1)*3,b2=N.epi?bowC(((t*.16+.1*i)%1+1)%1):0;
   sp.setAttribute('transform',`translate(${wx.toFixed(1)} ${sp.dataset.y}) rotate(${(b2*10).toFixed(1)})`);
   hd.setAttribute('transform',`translate(0 ${(N.epi?b2*2.6:Math.max(0,Math.sin(t*.7+i*1.7))*2.2).toFixed(2)})`)});
  N.bow.forEach(([g,x,ph,deg])=>{const b=N.epi?bowC(((t*.16+ph*.1)%1+1)%1):0;g.setAttribute('transform',`translate(${x} 0) rotate(${(b*deg).toFixed(1)})`)});
  const A=N.angel,ua=((T%38)+38)%38,op=T<0?0:ua<3?ua/3:ua<16?1:ua<19?(19-ua)/3:0;A.style.opacity=op.toFixed(2);
  A.setAttribute('transform',`translate(${(Math.sin(t*.5)*8-10).toFixed(1)} ${(-132+Math.sin(t*1.3)*2.5).toFixed(1)})`);
  const fl=(.35+.65*Math.abs(Math.sin(t*4))).toFixed(2);N.wl.setAttribute('transform',`scale(1 ${fl})`);N.wr.setAttribute('transform',`scale(1 ${fl})`)}
 // Niedziela Palmowa
 if(FX.palm){const Pm=FX.palm,P=80,n=Math.floor(T/P),u=T-n*P,v=15*k,xs=W+30,xr=xs-v*u,rd=Pm.rider;
  if(T<0){rd.style.display='none';Pm.crowd.forEach(p=>{p.style.display='none';p.leaf&&(p.leaf.style.display='none')})}
  else{rd.style.display='';const op=xr>door?1:Math.max(0,1-(door-xr)/(30*k));rd.style.opacity=op.toFixed(2);
   const st=Math.floor(v*u/5)%2;rd.lA.style.display=st?'none':'';rd.lB.style.display=st?'':'none';
   put(rd,xr,groundY-Math.abs(Math.sin(v*u/5*Math.PI))*.8,-1,sP);
   Pm.crowd.forEach((p,i)=>{if(mobile&&i>1){p.style.display='none';return}p.style.display='';const face=xr>p.xf?1:-1;
    put(p,p.xf,groundY,face,sP);p.fr.setAttribute('transform',`translate(6 -24) rotate(${(Math.sin(t*4+i*1.3)*25).toFixed(0)})`);

    const tt=(xs-(p.xf+28*sP))/v,xl=p.xf-14*sP;                       // rzut gałązki przed osiołka
    if(u<tt){p.leaf.style.display='none'}else{p.leaf.style.display='';const q=Math.min(1,(u-tt)/.9),x=p.xf+(xl-p.xf)*q,y=groundY-24*sP*(1-q)-Math.sin(q*Math.PI)*14*sP;
     p.leaf.setAttribute('transform',`translate(${x.toFixed(1)} ${(y-1).toFixed(1)}) scale(${sP.toFixed(2)}) rotate(${(-80*q+(1-q)*20).toFixed(0)})`)}})}}
 // Wielkanoc: kobiety idą do grobu, zaglądają, zdumione biegną z radością z powrotem
 if(FX.easter){const Eo=FX.easter,P=60,n=Math.floor(T/P),u=T-n*P,tombX=Eo.px-24*Eo.sc,vw=26*k,vr=72*k;
  Eo.women.forEach((w,i)=>{const r=u-i*1.3,xt=tombX-i*9*sP,Tw=(xt-door)/vw;w.armsUp.style.display='none';w.armsDown.style.display='';
   if(T<0||r<0){w.style.display='none';return}w.style.display='';w.style.opacity=1;
   if(r<Tw){const x=door+vw*r;w.style.opacity=Math.min(1,r).toFixed(2);put(w,x,groundY,1,sP);walkLegs(w,r*vw/sP)}
   else if(r<Tw+3){put(w,xt,groundY,1,sP,Math.min(1,(r-Tw)/.6)*14);walkLegs(w,0)}
   else if(r<Tw+4.4){const j=Math.abs(Math.sin((r-Tw-3)*Math.PI*2.2));put(w,xt,groundY-j*5*sP,1,sP);w.armsUp.style.display='';w.armsDown.style.display='none'}

    w.style.opacity=Math.min(1,Math.max(0,(x-door+20*k)/(20*k))).toFixed(2)}});
  if(FX.angelE)FX.angelE.setAttribute('transform',`translate(25 ${(-22+Math.sin(t*1.2)*.8).toFixed(2)})`)}
 // Zesłanie Ducha Świętego: uczniowie modlą się; nadlatuje gołębica, nad każdym zapala się ognisty język

// ===== suwak czasu: przewijanie wszystkich animacji =====
const tl=document.getElementById('tl'),tlv=document.getElementById('tlv'),playB=document.getElementById('play');
const MAXT=3600,v2t=v=>MAXT*Math.pow(v/1000,3),t2v=t=>Math.round(1000*Math.cbrt(Math.min(1,Math.max(0,t)/MAXT)));
const fmt=t=>t<60?t.toFixed(1)+' s':Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' min';
const cssAnims=()=>document.getAnimations().filter(a=>typeof CSSAnimation!=='undefined'&&a instanceof CSSAnimation);
function seek(t,full){
 paused=true;pausedT=t;scrubbed=true;
 cssAnims().forEach(a=>{if(a.__st===undefined)a.__st=a.startTime!=null?a.startTime:(document.timeline.currentTime-(a.currentTime||0));
  a.pause();a.currentTime=Math.max(0,t*1000-a.__st)});
 syncLeaves(full?1e9:6000);drawPile(true);
 snowTick();
 upd(t)}
function upd(t){tlv.value=fmt(t);playB.textContent='▶ Odtwórz';playB.setAttribute('aria-pressed','true')}
function resume(){clockOff=pausedT-performance.now()/1000;paused=false;cssAnims().forEach(a=>{const ct=a.effect&&a.effect.getComputedTiming();if(!ct||ct.endTime===Infinity||a.currentTime<ct.endTime)a.play()});
 playB.textContent='⏸ Pauza';playB.setAttribute('aria-pressed','false')}
let dragging=false;
tl.addEventListener('input',()=>{dragging=true;seek(v2t(+tl.value),false)});
tl.addEventListener('change',()=>{dragging=false;seek(v2t(+tl.value),true)});
playB.onclick=()=>paused?resume():seek(now(),true);
document.getElementById('toEnd').onclick=()=>{const [,w]=hourPos();let d=HOUR-240-w;if(d<0)d+=HOUR;seek(now()+d,true)};
const clk=document.getElementById('clk');setInterval(()=>{const w=wall(),dt=new Date(w*1000);clk.value=dt.toLocaleTimeString('pl-PL')},250);
(function follow(){if(!paused&&!dragging){tl.value=t2v(now());tlv.value=fmt(now())}requestAnimationFrame(follow)})();
