    <polygon class="hx" points="110.3,157 89,190 134,190"/>
    <!-- Brenna: słup pod podestem -->
    <polygon class="hx" points="74,204 152,204 152,216 94,240 74,240"/>

    <!-- czarne trójkąty dachu Brennej -->
    <polygon class="bk" points="108.4,79.2 69,130 153.9,130"/>
    <!-- biała wieża na tle czerni -->
    <rect class="wh" x="98.5" y="59" width="20" height="71"/>
    <!-- czarny blok u stóp wieży -->
    <rect class="bk" x="99" y="134" width="20.5" height="17"/>
    <!-- czarne kliny u podstawy iglicy Górek -->
    
    
    <!-- okno Górek -->
    <path class="bk" d="M190,105.5 V86 C190,81 192.5,78 195.75,75 C199,78 201.5,81 201.5,86 V105.5 Z"/>
  </g>

