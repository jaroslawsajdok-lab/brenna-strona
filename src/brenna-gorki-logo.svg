<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -4 310 248" width="620" height="496">
  <title>Parafia Ewangelicko-Augsburska Brenna-Górki</title>
  <defs>
    <pattern id="hatch" width="2.2" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="0.6" height="20" fill="#1d1d1b"/>
    </pattern>
  </defs>
  <style>
    .ln{fill:none;stroke:#1d1d1b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .th{stroke-width:1}
    .hx{fill:url(#hatch);stroke:none}
    .bk{fill:#1d1d1b;stroke:none}
    .wh{fill:#fff;stroke:none}
  </style>

